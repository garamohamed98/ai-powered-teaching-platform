<p-card header="Exercise:" >
  <div class="exercise-question-container">
    <div class="exercise-infos-row">
      <p>
        <b>
          Title:
        </b>
      </p>
      <p>
        {{exercise.title}}
      </p>
    </div>
    <div class="exercise-infos-row">
      <p>
        <b>
          Exercise type:
        </b>
      </p>
      <p>
        {{getExerciseTypeLabel(exercise.type)}}
      </p>
    </div>
    <div>
      <p>
        <b>
          Instructions:
        </b>
      </p>
      <p>
        {{exercise.instructions}}
      </p>
    </div>
    @switch (exercise.type) {
      @case ('MULTIPLE_CHOICE'){
        <app-multiple-choice-content
          [content]="exercise.content"
        ></app-multiple-choice-content>
      }
      @case ('FILL_IN_BLANK'){
        <app-fill-in-blank-content
          [content]="exercise.content"
        ></app-fill-in-blank-content>
      }
    }
  </div>
</p-card>
