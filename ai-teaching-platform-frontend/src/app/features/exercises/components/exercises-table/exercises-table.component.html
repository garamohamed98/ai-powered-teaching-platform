<p-card header="Exercise List">
  <p-table
    [value]="exercises"
    [tableStyle]="{ 'min-height': '60vh' }"
    [paginator]="true"
    [rows]="maxRows"
  >
    <ng-template #header>
      <tr>
        <th>Title</th>
      </tr>
    </ng-template>
    <ng-template #body let-exercise>
      <tr>
        <td class="title-row">
          @if (loading){
            <p-skeleton width="8rem" height="1rem"/>
          } @else {
            <p>{{exercise.title}}</p>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td>
          <p-message severity="info" text="No exercises found."/>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
