<div class="page-container">
  <div class="exercise-question-card">
    <app-exercise-infos
      [exercise]="exercise"
    ></app-exercise-infos>
  </div>
  <p-card header="Attempt" class="exercise-attempt-card">
    <form [formGroup]="form" class="form" (ngSubmit)="submit()">
      @switch (attempt.type){
        @case ('MULTIPLE_CHOICE'){
          <app-multiple-choice-attempt-form
            [content] = "attempt.content"
            [form] = 'attemptForm'
          ></app-multiple-choice-attempt-form>
        }
        @case ('FILL_IN_BLANK'){
          <app-fill-in-blank-attempt-form
            [content]="attempt.content"
            [form]="attemptForm"
          ></app-fill-in-blank-attempt-form>
        }
      }
      <div class="submit-button">
        <p-button type="submit" label="Submit"></p-button>
      </div>
    </form>
  </p-card>
</div>
