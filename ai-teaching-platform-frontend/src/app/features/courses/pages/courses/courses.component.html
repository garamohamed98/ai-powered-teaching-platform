<div class="page-container">
  <div>
    <p-button
      label="New Course"
      (onClick)="showCreateCourseModal()"
      icon="pi pi-plus"
      data-testid="new-course"
    />
  </div>
  <app-courses-form-modal
    [isVisible]="isCourseModalVisible()"
    [selectedCourse]="selectedCourse"
    (isVisibleChange)="isCourseModalVisible.set($event)"
    (courseSaved)="loadCourses()"
  ></app-courses-form-modal>
  <app-courses-table
    [maxRows]="maxRows"
    [courses]="courses()"
    [loading]="loading()"
    (courseDeleted)="loadCourses()"
    (editCourseClicked)="showEditCourseModal($event)"
  ></app-courses-table>
</div>
