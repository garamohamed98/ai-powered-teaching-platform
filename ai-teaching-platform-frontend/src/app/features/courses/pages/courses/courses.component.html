<div class="page-container">
  <div>
    <p-button
      label="New Course"
      (onClick)="showCreateCourseModal()"
      icon="pi pi-plus"
    />
  </div>
  <app-courses-form-modal
    [isVisible]="isCreateModalVisible()"
    (isVisibleChange)="isCreateModalVisible.set($event)"
    (courseCreated)="loadCourses()"
  ></app-courses-form-modal>
  <app-courses-table
    [maxRows]="maxRows"
    [courses]="courses()"
    [loading]="loading()"
  ></app-courses-table>
</div>
