<div class="card">
  <p-table [value]="courses" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Id</th>
        <th>Course</th>
      </tr>
    </ng-template>
    <ng-template #body let-courses>
      <tr>
        <td>{{ courses.id }}</td>
        <td>{{ "to long" }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
