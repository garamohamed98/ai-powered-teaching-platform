<p-dialog header="Create New Course" [modal]="true" [(visible)]="isVisible" (onHide)="close()" [style]="{ width: '80vw', height:'100vh'}">
  <form [formGroup]="form" (ngSubmit)="submit()" class="modal-form" >
    @if(form.get('title')?.touched && !form.get('title')?.valid){
      <div>
        . More then 3 character in course title is required
      </div>
    }
    <div class="modal-form-element">
      <label>Course Title</label>
      <input pInputText formControlName="title" placeholder="Enter Course Title">
    </div>
    <div class="modal-form-element">
      <label>Category</label>
      <p-select
        id="category"
        [options]="categoryList()"
        formControlName="categoryId"
        optionLabel="name"
        optionValue="id"
        placeholder="Select a Category"
        [loading]="categoryListLoading()"
      />
    </div>
    <div class="modal-form-element">
      <label>Visibility</label>
      <p-select
        id="visibility"
        [options]="visibility"
        formControlName="visibility"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a visibility"
      />
    </div>
    <div class="modal-submit-button-container">
      <p-button type="submit" label="Create Course" />
    </div>
  </form>
</p-dialog>
