<p-card header="Courses List">
  <p-table
    responsiveLayout="stack"
    [value]="courses"
    [paginator]="true"
    [rows]="maxRows"
  >
    <ng-template #header>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Visibility</th>
        <th>Create At</th>
      </tr>
    </ng-template>
    <ng-template #body let-course >
      <tr [routerLink]="[course.id,'course-details']" class="table-row">
        <td >
          <div class="title-row">
            <p-button class="button-menu" data-testid="menu-button"] (onClick)="openMenu($event, course)" [text]="true" icon="pi pi-ellipsis-v"/>
            @if (loading){
              <p-skeleton  width="8rem" height="1rem"/>
            } @else {
              <p>{{ course.title }}</p>
            }
            <p-button class="mobile-button-menu" data-testid="mobile-menu-button"] (onClick)="openMenu($event, course)" [text]="true" icon="pi pi-ellipsis-v"/>
          </div>
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.category.name }}</p>
          }
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p-tag [icon]="getVisibilityIcon(course.visibility)" [value]="getVisibilityLabel(course.visibility)" />
          }
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.createdAt | date:'dd MMM yyyy, HH:mm' }}</p>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td>
          <p-message severity="info" text="No courses found." />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
<p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" />
