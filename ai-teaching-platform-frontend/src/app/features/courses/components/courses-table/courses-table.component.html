<p-card header="Courses List">
  <p-table
    [value]="courses"
    [paginator]="true"
    [rows]="maxRows"
  >
    <ng-template #header>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Visibility</th>
        <th>Create At</th>
      </tr>
    </ng-template>
    <ng-template #body let-course>
      <tr>
        <td class="title-row">
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.title }}</p>
          }
          <div>
            <p-button [routerLink]="[course.id,'course-details']" [rounded]="true" icon="pi pi-chevron-right" [text]="true" size="small"/>
            <p-button data-testid="delete-course" [rounded]="true" icon="pi pi-trash" [text]="true" size="small" (onClick)="onDeleteCourse(course.id)" />
          </div>
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.category.name }}</p>
          }
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.visibility }}</p>
          }
        </td>
        <td>
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.createdAt | date:'dd MMM yyyy, HH:mm' }}</p>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td>
          <p-message severity="info" text="No courses found." />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
