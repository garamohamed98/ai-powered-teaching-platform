<p-card header="Courses List">
  <p-table
    [value]="courses"
    [tableStyle]="{ 'min-height': '60vh' }"
    [paginator]="true"
    [rows]="maxRows"
  >
    <ng-template #header>
      <tr>
        <th>Title</th>
      </tr>
    </ng-template>
    <ng-template #body let-course>
      <tr>
        <td class="title-row">
          @if (loading){
            <p-skeleton  width="8rem" height="1rem"/>
          } @else {
            <p>{{ course.title }}</p>
          }
          <p-button [routerLink]="[course.id,'lessons']" [rounded]="true" icon="pi pi-chevron-right" [text]="true" size="small"/>
          <p-button [rounded]="true" icon="pi pi-trash" [text]="true" size="small" (onClick)="onDeleteCourse(course.id)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td>
          <p-message severity="info" text="No courses found." />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
