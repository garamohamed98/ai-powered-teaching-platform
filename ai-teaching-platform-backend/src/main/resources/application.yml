spring:
  application:
    name: ai-teaching-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teaching_platform}
    username: ${DB_USER:teaching_platform_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.mohamedgara: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO

